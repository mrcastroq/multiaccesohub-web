<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiAcceso Hub | Catálogo Oficial</title>
    <style>
        :root {
            --bg-color: #0f1016;
            --card-bg: rgba(25, 26, 38, 0.7);
            --accent: #00d2d3;
            --text-main: #ffffff;
            --text-sub: #b2bec3;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(15, 16, 22, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 1.5rem; font-weight: 800; color: white; }
        .logo span { color: var(--accent); }
        nav a { color: white; text-decoration: none; margin-left: 20px; font-weight: 600; font-size: 0.95rem; }
        nav a:hover { color: var(--accent); }
        
        .hero {
            text-align: center;
            padding: 60px 20px 30px;
        }
        .hero h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .hero p { color: var(--text-sub); font-size: 1.1rem; }

        .catalogo-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }
        .product-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 210, 211, 0.15);
        }
        .card-image-wrapper {
            position: relative;
            height: 180px;
            background: #222;
        }
        .main-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .logo-app {
            position: absolute;
            bottom: -15px;
            left: 20px;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            border: 3px solid #191a26;
            background: white;
            object-fit: cover;
        }
        .badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 210, 211, 0.2);
            color: var(--accent);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            border: 1px solid var(--accent);
        }
        .card-content {
            padding: 25px 20px 20px;
        }
        .title {
            font-size: 1.2rem;
            margin: 0 0 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .subtitle {
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .garantia-tag {
            font-size: 0.8rem;
            color: #fdcb6e;
            margin-bottom: 12px;
            display: block;
            font-weight: 600;
        }
        .cta-button {
            display: block;
            text-align: center;
            background: #00d2d3;
            color: #0f1016;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .cta-button:hover { background: #01a3a4; color: white; }
        
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #25d366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            z-index: 1000;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MultiAcceso <span>Hub</span></div>
        <nav>
            <a href="#">Inicio</a>
            <a href="#catalogo">Catálogo</a>
            <a href="https://wa.me/51928353023?text=Hola,%20vengo%20de%20la%20web%20y%20quiero%20información%20sobre%20precios%20para%20revendedores." target="_blank" style="color: #fd79a8;">¿Eres Revendedor?</a>
        </nav>
    </header>

    <div class="hero">
        <h1>Cuentas Premium al Mejor Precio</h1>
        <p>Catálogo oficial con entrega inmediata y garantía.</p>
    </div>

    <div class="catalogo-container" id="catalogo">
        <p style="text-align: center; color: #b2bec3; grid-column: 1 / -1;">Cargando productos en tiempo real...</p>
    </div>

    <a href="#" id="wa-button" target="_blank" class="whatsapp-float">💬</a>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAB8US1SzRNLKdrS13HdDtdu06lkfSC_oc",
          authDomain: "multiaccesohub-4c22f.firebaseapp.com",
          projectId: "multiaccesohub-4c22f",
          storageBucket: "multiaccesohub-4c22f.firebasestorage.app",
          messagingSenderId: "125766749639",
          appId: "1:125766749639:web:efc7f5baee812fa8845de2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const tasaCambioDolar = 3.80; 
        const telefonoWhatsApp = "51928353023"; 
        
        const waUrlBase = "https://wa.me/" + telefonoWhatsApp + "?text=";
        document.getElementById('wa-button').href = waUrlBase + encodeURIComponent("Hola MultiAcceso Hub, vengo de la web y quiero más información sobre sus servicios.");

        async function cargarCatalogoPublico() {
            const querySnapshot = await getDocs(collection(db, "productos"));
            const catalogo = document.getElementById('catalogo');
            catalogo.innerHTML = '';

            if (querySnapshot.empty) {
                catalogo.innerHTML = '<p style="text-align: center; color: #b2bec3; grid-column: 1 / -1;">No hay productos disponibles por el momento.</p>';
                return;
            }

            querySnapshot.forEach((docSnap) => {
                const prod = docSnap.data();
                
                // Lógica matemática de conversión y redondeo hacia arriba al 0.50 a favor
                let precioSolesBruto = prod.precioUSD * tasaCambioDolar;
                let precioSolesFinal = Math.ceil(precioSolesBruto * 2) / 2;

                // Mensaje inteligente según el tipo de entrega
                let mensajeWhatsApp = "";
                if (prod.tipoEntrega === "invitacion") {
                    mensajeWhatsApp = waUrlBase + encodeURIComponent(`Hola MultiAcceso Hub, vengo de la web y estoy interesado en ${prod.nombre} (${prod.duracion}) por S/ ${precioSolesFinal.toFixed(2)}. Mi correo para la invitación es: `);
                } else {
                    mensajeWhatsApp = waUrlBase + encodeURIComponent(`Hola MultiAcceso Hub, vengo de la web y quiero comprar ${prod.nombre} (${prod.duracion}) por S/ ${precioSolesFinal.toFixed(2)}.`);
                }

                let garantiaHTML = prod.garantia ? `<span class="garantia-tag">🛡️ ${prod.garantia}</span>` : '';

                let card = `
                <div class="product-card">
                    <div class="card-image-wrapper">
                        <div class="badge">${prod.duracion || 'Disponible'}</div>
                        <img src="${prod.imagenFondo || 'https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d'}" alt="${prod.nombre}" class="main-bg">
                        <img src="${prod.logoApp || 'https://via.placeholder.com/150'}" alt="Logo" class="logo-app">
                    </div>
                    <div class="card-content">
                        <h2 class="title">
                            ${prod.nombre} 
                            <div style="text-align: right;">
                                <div style="font-size: 0.75rem; color: #b2bec3;">$${prod.precioUSD.toFixed(2)} USD</div>
                                <div style="font-size: 1.1rem; color: #00d2d3; font-weight: 800;">S/ ${precioSolesFinal.toFixed(2)}</div>
                            </div>
                        </h2>
                        ${garantiaHTML}
                        <p class="subtitle">${prod.descripcion || ''}</p>
                        <a href="${mensajeWhatsApp}" target="_blank" class="cta-button">Comprar por WhatsApp</a>
                    </div>
                </div>`;
                catalogo.innerHTML += card;
            });
        }

        cargarCatalogoPublico();
    </script>
</body>
</html>
